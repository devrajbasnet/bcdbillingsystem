<!DOCTYPE html>
<html>
<head>
    <title>BCD Billing System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: Arial; background:#f4f4f4; text-align:center; margin: 0; padding-bottom: 50px; }
        
        /* Main Header */
        .header-container { 
            background:#222; 
            color:white; 
            padding:20px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }
        .header-main { display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .header-main img { height: 60px; margin-right: 15px; border-radius: 4px; }
        h1 { margin: 0; font-size: 28px; }
        .header-contact-info { font-size: 13px; color: #ccc; display: flex; gap: 20px; margin-top: 8px; }
        .header-contact-info i { color: #28a745; margin-right: 5px; }

        .pan-display { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: bold; color: #aaa; }
        #liveClock { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-family: 'Courier New', monospace; background: #444; padding: 5px 10px; border-radius: 5px; font-size: 16px; }

        /* Navigation & Controls */
        input { padding:8px; margin:5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding:8px 15px; margin:5px; cursor:pointer; font-weight: bold; border-radius: 4px; border: none; }
        .nav { margin:20px; background: #ddd; padding: 15px; display: inline-block; border-radius: 8px; }
        
        table { margin:20px auto; border-collapse: collapse; width:95%; background:white; }
        th, td { border:1px solid #ddd; padding:10px; }
        th { background:#444; color:white; }
        
        .danger { background:red; color:white; }
        .print-full-btn { background: #007bff; color: white; }
        .select-print-btn { background: #28a745; color: white; }

        #computer-gen-note, #print-timestamp { display: none; }

        /* Print Settings for Full Day Record (A4/Default) */
        @media print {
            .no-print, .nav, button, input, h3:not(#total), #status, .checkbox-cell, hr, #liveClock { display: none !important; }
            #computer-gen-note { display: block !important; margin-top: 30px; font-style: italic; font-size: 12px; }
            #print-timestamp { display: block !important; text-align: left; margin: 10px 0 10px 2.5%; font-size: 11px; }
            body { background: white; padding: 0; }
            .header-container { background: none; color: black; border-bottom: 2px solid black; }
            .header-contact-info, .pan-display { color: black; }
            .header-contact-info i { color: black; }
            th { background: #eee !important; color: black !important; }
            #total, #grand { text-align: right; margin-right: 5%; }
        }
    </style>
</head>

<body>

<div class="header-container">
    <div class="pan-display">PAN: 127228299</div>
    <div class="header-main">
        <img src="bcd.png" alt="Logo"> 
        <h1>BCD SUPPLIERS</h1>
    </div>
    <div class="header-contact-info">
        <span><i class="fa-solid fa-location-dot"></i> Kalimati-13, Kathmandu</span>
        <span><i class="fa-solid fa-phone"></i> 9761795579 / 9702046747</span>
        <span><i class="fa-solid fa-envelope"></i> bcdsuppliers@gmail.com</span>
    </div>
    <div id="liveClock" class="no-print">00:00:00</div>
</div>

<div id="print-timestamp"></div>

<div class="nav no-print">
    <button onclick="prevDay()">⬅ Previous</button>
    <input type="date" id="dateFilter" onchange="filterByDate(this.value)">
    <button onclick="nextDay()">Next ➡</button>
    <br>
    <span id="currentDate" style="font-size:18px;font-weight:bold; display:block; margin-top:5px;"></span>
</div>

<div class="no-print">
    <h3>Status: <span id="status">Open</span></h3>
    <input type="text" id="item" placeholder="Item Name">
    <input type="number" id="qty" placeholder="Qty">
    <input type="number" id="price" placeholder="Price">
    <br>
    <button onclick="addItem()" style="background:#444; color:white;">Add Item</button>
    <button onclick="closeDay()" style="background:#666; color:white;">Close Day</button>
    <button onclick="openDay()" style="background:#666; color:white;">Reopen Day</button>
    <hr style="width: 50%; margin: 20px auto;">
    <button class="print-full-btn" onclick="prepareAndPrintFull()">🖨 Print Full Day Record</button>
    <button class="select-print-btn" onclick="printSelectedItems()">✅ Print Selected Items Only </button>
    <button onclick="resetBillCounter()" style="background:#888; color:white; font-size:10px;">Reset Bill</button>
</div>

<table id="table">
    <thead>
        <tr>
            <th class="no-print checkbox-cell" style="width:40px;">Select</th>
            <th style="width:50px;">S.N.</th>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
            <th class="no-print">Actions</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<h3 id="total"></h3>
<h2 id="grand"></h2>

<div id="computer-gen-note">
    <hr style="border: 0.5px solid #ccc; width: 80%;">
    <p>This is a computer-generated report; no signature is required.</p>
    <p style="font-weight: bold;">www.bcdsuppliers.com.np</p>
</div>

<script>
let today = new Date();
today.setHours(0,0,0,0);
let currentDate = new Date(today);
let isClosed = false;

const LOGO_URL = "bcd.png"; 
const PAN_NO = "127228299"; 
const COMPANY_NAME = "BCD SUPPLIERS";

function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

function formatDate(d){
    let z = d.getTimezoneOffset() * 60000;
    return (new Date(d - z)).toISOString().slice(0, 10);
}

function filterByDate(val) {
    if(!val) return;
    currentDate = new Date(val);
    loadData();
}

function loadData(){
    let key = formatDate(currentDate);
    document.getElementById("currentDate").innerText = "Date: " + key;
    document.getElementById("dateFilter").value = key;
    let data = JSON.parse(localStorage.getItem(key)) || [];
    let status = localStorage.getItem(key+"_status") || "open";
    isClosed = (status === "closed");
    document.getElementById("status").innerText = status.toUpperCase();
    renderTable(data);
}

function saveData(data){
    let key = formatDate(currentDate);
    localStorage.setItem(key, JSON.stringify(data));
}

function addItem(){
    if(isClosed){ alert("Day is closed!"); return; }
    let item = document.getElementById("item").value;
    let qty = parseInt(document.getElementById("qty").value);
    let price = parseFloat(document.getElementById("price").value);
    if(!item || isNaN(qty) || isNaN(price)){ alert("Check fields"); return; }
    let key = formatDate(currentDate);
    let data = JSON.parse(localStorage.getItem(key)) || [];
    data.push({ item, qty, price, total: qty * price });
    saveData(data);
    loadData();
    document.getElementById("item").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("price").value = "";
}

function renderTable(data){
    let tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";
    let sum = 0;
    data.forEach((d, i) => {
        let row = tableBody.insertRow();
        row.insertCell(0).innerHTML = `<input type="checkbox" class="item-checkbox no-print" data-index="${i}">`;
        row.cells[0].className = "no-print";
        row.insertCell(1).innerText = i + 1; 
        row.insertCell(2).innerText = d.item;
        row.insertCell(3).innerText = d.qty;
        row.insertCell(4).innerText = d.price;
        row.insertCell(5).innerText = d.total;
        let actionCell = row.insertCell(6);
        actionCell.className = "no-print"; 
        actionCell.innerHTML = isClosed ? "Locked" : `<button class='danger' onclick='deleteItem(${i})'>Delete</button>`;
        sum += d.total;
    });
    document.getElementById("total").innerText = "Total: Rs " + sum;
    document.getElementById("grand").innerText = "Grand Total: Rs " + sum.toFixed(2);
}

function deleteItem(index){
    if(confirm("Delete this record?")) {
        let key = formatDate(currentDate);
        let data = JSON.parse(localStorage.getItem(key)) || [];
        data.splice(index, 1);
        saveData(data);
        loadData();
    }
}

function prepareAndPrintFull() {
    let key = formatDate(currentDate);
    document.getElementById('print-timestamp').innerText = `Report Date: ${key} | Printed At: ${new Date().toLocaleTimeString()}`;
    window.print();
}

function printSelectedItems() {
    let key = formatDate(currentDate);
    let data = JSON.parse(localStorage.getItem(key)) || [];
    let selectedItems = [];
    let checkboxes = document.querySelectorAll('.item-checkbox:checked');
    
    if (checkboxes.length === 0) { 
        alert("Select items first!"); 
        return; 
    }

    // UPDATED PROMPT: Requesting both name and address
    let inputInfo = prompt("Enter Customer Name & Address:", "Cash Sales");
    let customerInfo = (inputInfo === null || inputInfo.trim() === "") ? "Cash Sales" : inputInfo;

    let billNo = localStorage.getItem("lastBillNumber") || 0;
    billNo = parseInt(billNo) + 1;

    checkboxes.forEach(cb => selectedItems.push(data[cb.getAttribute('data-index')]));

    let billTotal = selectedItems.reduce((acc, curr) => acc + curr.total, 0);
    let printWindow = window.open('', '_blank', 'width=600,height=800');
    
    let tableRows = selectedItems.map((item, index) => 
        `<tr><td>${index + 1}</td><td>${item.item}</td><td>${item.qty}</td><td>${item.price}</td><td>${item.total}</td></tr>`
    ).join('');

    printWindow.document.write(`
        <html>
        <head>
            <title>Bill No: ${billNo}</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
            <style>
                @page { size: A5; margin: 5mm; }
                body { font-family: Arial, sans-serif; padding: 10px; text-align: center; font-size: 12px; }
                .bill-container { border: 1px solid black; padding: 10px; min-height: 185mm; box-sizing: border-box; display: flex; flex-direction: column; }
                .pan-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 11px; margin-bottom: 2px; }
                .header-section { display: flex; align-items: center; justify-content: center; border-bottom: 1.5px solid black; padding-bottom: 8px; margin-bottom: 10px; }
                .header-section img { height: 45px; margin-right: 10px; }
                .company-info h2 { margin: 0; font-size: 18px; text-transform: uppercase; }
                .contact-info { font-size: 10px; margin-top: 3px; color: #000; line-height: 1.2; }
                .meta-info { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; font-weight: bold; border-bottom: 1px dashed #ccc; padding-bottom: 3px; text-align: left; }
                /* Updated styling to allow address wrapping */
                .customer-row { text-align: left; font-size: 11px; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; line-height: 1.4; }
                table { width: 100%; border-collapse: collapse; margin-top: 5px; }
                th, td { border: 1px solid black; padding: 6px; text-align: left; font-size: 11px; }
                th { background-color: #f2f2f2; }
                .total-section { margin-top: 10px; text-align: right; font-size: 14px; font-weight: bold; border-top: 1px solid black; padding-top: 5px; }
                .spacer { flex-grow: 1; }
                .sig-section { display: flex; justify-content: space-between; padding: 0 10px; margin-top: 40px; margin-bottom: 10px; }
                .sig-box { width: 140px; border-top: 1px solid black; padding-top: 3px; font-size: 10px; font-weight: bold; }
                .footer-web { font-size: 9px; font-style: italic; color: #555; }
            </style>
        </head>
        <body>
            <div class="bill-container">
                <div class="pan-row">
                    <span>PAN: ${PAN_NO}</span>
                    <span>Bill No: ${billNo}</span>
                </div>
                <div class="header-section">
                    <img src="${LOGO_URL}" onerror="this.style.display='none'">
                    <div class="company-info">
                        <h2>${COMPANY_NAME}</h2>
                        <div class="contact-info">
                            <i class="fa-solid fa-location-dot"></i> Kalimati-13, Kathmandu<br>
                            <i class="fa-solid fa-phone"></i> 9761795579 / 9702046747<br>
                            <i class="fa-solid fa-envelope"></i> bcdsuppliers@gmail.com
                        </div>
                    </div>
                </div>
                <div class="meta-info">
                    <span>Date: ${key}</span>
                    <span>Time: ${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="customer-row">Name & Address: ${customerInfo}</div>
                <table>
                    <thead><tr><th>S.N.</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="total-section">Grand Total: Rs ${billTotal.toFixed(2)}</div>
                <div class="spacer"></div>
                <div class="sig-section"><div class="sig-box">Receiver's Signature</div><div class="sig-box">Authorized Signature</div></div>
                <div class="footer-web">www.bcdsuppliers.com.np</div>
            </div>
            <script>
                window.onload = function() { 
                    setTimeout(function(){ window.print(); window.close(); }, 700); 
                }
            <\/script>
        </body>
        </html>
    `);
    printWindow.document.close();
    localStorage.setItem("lastBillNumber", billNo);
}

function resetBillCounter() {
    if(confirm("Reset bill number to 1?")) {
        localStorage.setItem("lastBillNumber", 0);
        alert("Counter reset!");
    }
}

function closeDay(){ localStorage.setItem(formatDate(currentDate)+"_status", "closed"); loadData(); }
function openDay(){ localStorage.setItem(formatDate(currentDate)+"_status", "open"); loadData(); }
function prevDay(){ currentDate.setDate(currentDate.getDate() - 1); loadData(); }
function nextDay(){ currentDate.setDate(currentDate.getDate() + 1); loadData(); }
loadData();
</script>

</body>
</html>
