<!DOCTYPE html>
<html>
<head>
    <title>BCD Billing System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: Arial; background:#f4f4f4; text-align:center; margin: 0; padding-bottom: 50px; }
        
        /* Main Header */
        .header-container { 
            background:#222; 
            color:white; 
            padding:15px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }
        .header-main { display: flex; align-items: center; justify-content: center; margin-bottom: 5px; }
        .header-main img { height: 50px; margin-right: 15px; border-radius: 4px; }
        h1 { margin: 0; font-size: 24px; }
        .header-contact-info { font-size: 12px; color: #ccc; display: flex; gap: 15px; margin-top: 5px; }
        .header-contact-info i { color: #28a745; margin-right: 5px; }

        .pan-display { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: bold; color: #aaa; }
        #liveClock { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-family: 'Courier New', monospace; background: #444; padding: 5px 10px; border-radius: 5px; font-size: 14px; }

        /* Navigation & Controls */
        input { padding:8px; margin:5px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding:8px 15px; margin:5px; cursor:pointer; font-weight: bold; border-radius: 4px; border: none; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .nav { margin:20px; background: #ddd; padding: 15px; display: inline-block; border-radius: 8px; border: 1px solid #bbb; }
        
        table { margin:20px auto; border-collapse: collapse; width:95%; background:white; }
        th, td { border:1px solid #ddd; padding:10px; }
        th { background:#444; color:white; }
        
        .danger { background:red; color:white; }
        .view-btn { background: #17a2b8; color: white; }
        .print-full-btn { background: #007bff; color: white; }
        .select-print-btn { background: #28a745; color: white; }
        .history-btn { background: #6f42c1; color: white; }
        .monthly-btn { background: #ff8c00; color: white; }
        .monthly-history-btn { background: #20c997; color: white; }

        #billHistorySection { display: none; margin-top: 30px; border-top: 3px solid #6f42c1; padding-top: 20px; background: #f9f9f9; }

        @media print {
            .no-print, .nav, button, input, h3:not(#total), #status, .checkbox-cell, hr, #liveClock, #billHistorySection { display: none !important; }
            body { background: white; padding: 0; }
            .header-container { background: none; color: black; border-bottom: 2px solid black; }
        }
    </style>
</head>

<body>

<div class="header-container">
    <div class="pan-display">PAN: 127228299</div>
    <div class="header-main">
        <img src="bcd.png" alt="Logo"> 
        <h1>BCD SUPPLIERS</h1>
    </div>
    <div class="header-contact-info">
        <span><i class="fa-solid fa-location-dot"></i> Kalimati-13, Kathmandu</span>
        <span><i class="fa-solid fa-phone"></i> 9761795579 / 9702046747</span>
        <span><i class="fa-solid fa-envelope"></i> bcdsuppliers@gmail.com</span>
    </div>
    <div id="liveClock" class="no-print">00:00:00</div>
</div>

<div class="nav no-print">
    <div style="margin-bottom: 10px;">
        <button onclick="prevDay()">⬅ Previous Day</button>
        <input type="date" id="dateFilter" onchange="filterByDate(this.value)">
        <button onclick="nextDay()">Next Day ➡</button>
    </div>
    <span id="currentDate" style="font-size:18px;font-weight:bold; display:block; margin-bottom:10px;"></span>
    
    <div style="border-top: 2px solid #bbb; padding-top: 15px; margin-top: 10px;">
        <label style="font-size: 14px; font-weight: bold; color: #444;">📊 MONTHLY REPORTS</label><br>
        <input type="month" id="monthFilter">
        <div style="margin-top: 5px;">
            <button class="monthly-btn" onclick="printMonthlyReport()">📄 Monthly Sales Report</button>
            <button class="monthly-history-btn" onclick="printMonthlyBillHistory()">📋 Detailed Bill History</button>
        </div>
    </div>
</div>

<div class="no-print">
    <h3>Status: <span id="status">Open</span></h3>
    <input type="text" id="item" placeholder="Item Name">
    <input type="number" id="qty" placeholder="Qty">
    <input type="number" id="price" placeholder="Price">
    <br>
    <button onclick="addItem()" style="background:#444; color:white;">Add Item</button>
    <button onclick="closeDay()" style="background:#666; color:white;">Close Day</button>
    <button onclick="openDay()" style="background:#666; color:white;">Reopen Day</button>
    <hr style="width: 50%; margin: 20px auto;">
    <button class="print-full-btn" onclick="prepareAndPrintFull()">🖨 Print Full Day Record</button>
    <button class="select-print-btn" onclick="printSelectedItems()">✅ Print Selected Items Only </button>
    <button class="history-btn" onclick="toggleHistory()">📋 View Bill Records</button>
    <button onclick="resetBillCounter()" style="background:#888; color:white; font-size:10px;">Reset Bill #</button>
</div>

<table id="table">
    <thead>
        <tr>
            <th class="no-print checkbox-cell" style="width:40px;">Select</th>
            <th style="width:50px;">S.N.</th>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
            <th class="no-print">Actions</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<h3 id="total"></h3>
<h2 id="grand"></h2>

<div id="billHistorySection" class="no-print">
    <h2 style="color:#6f42c1;">Bill Records for <span id="historyDateLabel"></span></h2>
    <table id="historyTable">
        <thead>
            <tr>
                <th>Bill No</th>
                <th>Time</th>
                <th>Customer Name & Address</th>
                <th>Total Amount</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
    </table>
</div>

<script>
let today = new Date();
today.setHours(0,0,0,0);
let currentDate = new Date(today);
let isClosed = false;

const LOGO_URL = "bcd.png"; 
const PAN_NO = "127228299"; 
const COMPANY_NAME = "BCD SUPPLIERS";
const WEBSITE_URL = "www.bcdsuppliers.com.np";
const PHONE_INFO = "9761795579, 9702046747";
const EMAIL_INFO = "bcdsuppliers@gmail.com";

function updateClock() {
    const now = new Date();
    document.getElementById('liveClock').innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

function formatDate(d){
    let z = d.getTimezoneOffset() * 60000;
    return (new Date(d - z)).toISOString().slice(0, 10);
}

function filterByDate(val) {
    if(!val) return;
    currentDate = new Date(val);
    loadData();
}

function loadData(){
    let key = formatDate(currentDate);
    document.getElementById("currentDate").innerText = "Date: " + key;
    document.getElementById("historyDateLabel").innerText = key;
    document.getElementById("dateFilter").value = key;
    
    let data = JSON.parse(localStorage.getItem(key)) || [];
    let status = localStorage.getItem(key+"_status") || "open";
    isClosed = (status === "closed");
    document.getElementById("status").innerText = status.toUpperCase();
    
    renderTable(data);
    renderHistory();
}

function saveData(data){
    let key = formatDate(currentDate);
    localStorage.setItem(key, JSON.stringify(data));
}

function addItem(){
    if(isClosed){ alert("Day is closed!"); return; }
    let item = document.getElementById("item").value;
    let qty = parseInt(document.getElementById("qty").value);
    let price = parseFloat(document.getElementById("price").value);
    if(!item || isNaN(qty) || isNaN(price)){ alert("Check fields"); return; }
    let key = formatDate(currentDate);
    let data = JSON.parse(localStorage.getItem(key)) || [];
    data.push({ item, qty, price, total: qty * price });
    saveData(data);
    loadData();
    document.getElementById("item").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("price").value = "";
}

function renderTable(data){
    let tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "";
    let sum = 0;
    data.forEach((d, i) => {
        let row = tableBody.insertRow();
        row.insertCell(0).innerHTML = `<input type="checkbox" class="item-checkbox no-print" data-index="${i}">`;
        row.cells[0].className = "no-print";
        row.insertCell(1).innerText = i + 1; 
        row.insertCell(2).innerText = d.item;
        row.insertCell(3).innerText = d.qty;
        row.insertCell(4).innerText = d.price;
        row.insertCell(5).innerText = d.total;
        let actionCell = row.insertCell(6);
        actionCell.className = "no-print"; 
        actionCell.innerHTML = isClosed ? "Locked" : `<button class='danger' onclick='deleteItem(${i})'>Delete</button>`;
        sum += d.total;
    });
    document.getElementById("total").innerText = "Total: Rs " + sum;
    document.getElementById("grand").innerText = "Grand Total: Rs " + sum.toFixed(2);
}

function toggleHistory() {
    let section = document.getElementById("billHistorySection");
    section.style.display = (section.style.display === "none" || section.style.display === "") ? "block" : "none";
}

function renderHistory() {
    let key = formatDate(currentDate);
    let allHistory = JSON.parse(localStorage.getItem("all_bill_history")) || [];
    let hTableBody = document.getElementById("historyTableBody");
    hTableBody.innerHTML = "";
    
    let dailyHistory = allHistory.filter(bill => bill.date === key);
    
    if (dailyHistory.length === 0) {
        hTableBody.innerHTML = "<tr><td colspan='5' style='padding:20px; color:#888;'>No individual bills found for this date.</td></tr>";
        return;
    }

    dailyHistory.slice().reverse().forEach((bill) => {
        let row = hTableBody.insertRow();
        row.insertCell(0).innerText = bill.billNo;
        row.insertCell(1).innerText = bill.time;
        row.insertCell(2).innerText = bill.customer;
        row.insertCell(3).innerText = "Rs " + bill.grandTotal.toFixed(2);
        let actions = row.insertCell(4);
        
        let deleteBtn = isClosed ? "" : `<button class="danger" style="padding:4px 8px; font-size:10px" onclick='deleteBill(${bill.billNo})'>Delete</button>`;
        
        actions.innerHTML = `
            <button class="view-btn" onclick='reprintBill(${JSON.stringify(bill)})'>👁 View</button> 
            ${deleteBtn}
        `;
    });
}

function deleteBill(bNo) {
    if(confirm("Delete record for Bill #" + bNo + "?")) {
        let history = JSON.parse(localStorage.getItem("all_bill_history")) || [];
        history = history.filter(b => b.billNo !== bNo);
        localStorage.setItem("all_bill_history", JSON.stringify(history));
        renderHistory();
    }
}

function printSelectedItems() {
    let key = formatDate(currentDate);
    let data = JSON.parse(localStorage.getItem(key)) || [];
    let selectedItems = [];
    let checkboxes = document.querySelectorAll('.item-checkbox:checked');
    
    if (checkboxes.length === 0) { alert("Select items first!"); return; }

    let inputInfo = prompt("Enter Customer Name & Address:", "Cash Sales");
    let customerInfo = (inputInfo === null || inputInfo.trim() === "") ? "Cash Sales" : inputInfo;

    let billNo = localStorage.getItem("lastBillNumber") || 0;
    billNo = parseInt(billNo) + 1;

    checkboxes.forEach(cb => selectedItems.push(data[cb.getAttribute('data-index')]));
    let billTotal = selectedItems.reduce((acc, curr) => acc + curr.total, 0);

    const billRecord = {
        billNo: billNo,
        date: key,
        time: new Date().toLocaleTimeString(),
        customer: customerInfo,
        items: selectedItems,
        grandTotal: billTotal
    };

    let history = JSON.parse(localStorage.getItem("all_bill_history")) || [];
    history.push(billRecord);
    localStorage.setItem("all_bill_history", JSON.stringify(history));
    
    localStorage.setItem("lastBillNumber", billNo);
    reprintBill(billRecord);
    loadData();
}

function reprintBill(bill) {
    let printWindow = window.open('', '_blank', 'width=600,height=800');
    let tableRows = bill.items.map((item, index) => 
        `<tr><td>${index + 1}</td><td>${item.item}</td><td>${item.qty}</td><td>${item.price}</td><td>${item.total}</td></tr>`
    ).join('');

    printWindow.document.write(`
        <html>
        <head>
            <title>Bill No: ${bill.billNo}</title>
            <style>
                @page { size: A5; margin: 0; }
                html, body { margin: 0; padding: 0; }
                body { font-family: Arial; text-align: center; font-size: 11px; width: 148mm; height: 210mm; display: block; overflow: hidden; }
                .bill-container { border: 1px solid black; padding: 8mm; margin: 5mm; height: 195mm; display: flex; flex-direction: column; box-sizing: border-box; }
                .pan-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 10px; margin-bottom: 2mm; }
                .header-section { display: flex; align-items: center; justify-content: center; border-bottom: 1.2px solid black; padding-bottom: 3mm; margin-bottom: 3mm; }
                .header-section img { height: 35px; margin-right: 8px; }
                .company-info h2 { margin: 0; font-size: 16px; text-transform: uppercase; }
                .contact-details { font-size: 9px; margin-top: 1px; color: #333; line-height: 1.2; }
                .meta-info { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 3mm; font-weight: bold; border-bottom: 1px dashed #ccc; padding-bottom: 1mm; }
                .customer-row { text-align: left; font-size: 10px; font-weight: bold; margin-bottom: 3mm; }
                table { width: 100%; border-collapse: collapse; margin-top: 2mm; }
                th, td { border: 0.8px solid black; padding: 4px; text-align: left; font-size: 10px; }
                .total-section { margin-top: 5mm; text-align: right; font-size: 12px; font-weight: bold; border-top: 1px solid black; padding-top: 2mm; }
                
                .spacer { flex-grow: 1; min-height: 10mm; }
                
                .signature-section { display: flex; justify-content: space-between; margin-top: 10mm; padding: 0 5mm; }
                .sig-box { border-top: 1px solid black; width: 110px; text-align: center; font-size: 9px; padding-top: 2px; font-weight: bold; }
                .footer-web { font-size: 9px; font-weight: bold; margin-top: 5mm; text-align: center; }
            </style>
        </head>
        <body>
            <div class="bill-container">
                <div class="pan-row"><span>PAN: ${PAN_NO}</span><span>Bill No: ${bill.billNo}</span></div>
                <div class="header-section">
                    <img src="${LOGO_URL}" onerror="this.style.display='none'">
                    <div class="company-info">
                        <h2>${COMPANY_NAME}</h2>
                        <div class="contact-details">
                            Kalimati-13, Kathmandu<br>
                            Ph: ${PHONE_INFO} | Email: ${EMAIL_INFO}
                        </div>
                    </div>
                </div>
                <div class="meta-info"><span>Date: ${bill.date}</span><span>Time: ${bill.time}</span></div>
                <div class="customer-row">Name: ${bill.customer}</div>
                <table>
                    <thead><tr><th style="width:10%">S.N.</th><th>Item</th><th style="width:10%">Qty</th><th style="width:15%">Price</th><th style="width:20%">Total</th></tr></thead>
                    <tbody>${tableRows}</tbody>
                </table>
                <div class="total-section">Grand Total: Rs ${bill.grandTotal.toFixed(2)}</div>
                
                <div class="spacer"></div>
                
                <div class="signature-section">
                    <div class="sig-box">Receiver's Signature</div>
                    <div class="sig-box">Authorized Signature</div>
                </div>
                <div class="footer-web">${WEBSITE_URL}</div>
            </div>
            <script>window.onload = function() { setTimeout(function(){ window.print(); window.close(); }, 500); }<\/script>
        </body>
        </html>
    `);
    printWindow.document.close();
}

/** UPDATED TABULAR MONTHLY BILL HISTORY **/
function printMonthlyBillHistory() {
    const selectedMonth = document.getElementById('monthFilter').value;
    if (!selectedMonth) { alert("Please select a month!"); return; }

    let allHistory = JSON.parse(localStorage.getItem("all_bill_history")) || [];
    let filteredBills = allHistory.filter(bill => bill.date.startsWith(selectedMonth));

    if (filteredBills.length === 0) { alert("No individual bill records found for " + selectedMonth); return; }

    // Sort by date ascending
    filteredBills.sort((a, b) => new Date(a.date) - new Date(b.date) || a.billNo - b.billNo);

    let printWindow = window.open('', '_blank', 'width=1000,height=700');
    let tableRows = filteredBills.map(bill => `
        <tr>
            <td>${bill.billNo}</td>
            <td>${bill.date}</td>
            <td>${bill.customer}</td>
            <td style="text-align:right; font-weight:bold;">Rs ${bill.grandTotal.toFixed(2)}</td>
        </tr>
    `).join('');

    let grandTotal = filteredBills.reduce((sum, bill) => sum + bill.grandTotal, 0);

    printWindow.document.write(`
        <html>
        <head>
            <title>Detailed Bill History - ${selectedMonth}</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 30px; color: #333; }
                .header { text-align: center; border-bottom: 2.5px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
                h1 { margin: 0; font-size: 26px; text-transform: uppercase; }
                .sub-info { font-size: 14px; margin-top: 5px; font-weight: bold; }
                table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                th, td { border: 1px solid #999; padding: 12px; text-align: left; font-size: 13px; }
                th { background-color: #f2f2f2; color: #000; font-weight: bold; text-transform: uppercase; }
                tr:nth-child(even) { background-color: #fafafa; }
                .footer { margin-top: 25px; text-align: right; font-size: 18px; font-weight: bold; border-top: 2px solid #222; padding-top:10px; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1>${COMPANY_NAME}</h1>
                <div class="sub-info">DETAILED MONTHLY BILLING LOG: ${selectedMonth}</div>
                <div style="font-size:12px; margin-top:4px;">PAN: ${PAN_NO} | ${WEBSITE_URL}</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width:10%;">Bill #</th>
                        <th style="width:15%;">Bill Date</th>
                        <th style="width:50%;">Customer Name & Address</th>
                        <th style="width:25%; text-align:right;">Total Amount</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
            <div class="footer">Monthly Revenue Total: Rs ${grandTotal.toFixed(2)}</div>
            <p style="font-size:10px; color:#666; margin-top:40px;">Report Generated On: ${new Date().toLocaleString()}</p>
            <script>window.onload = function() { window.print(); window.close(); }<\/script>
        </body>
        </html>
    `);
    printWindow.document.close();
}

function printMonthlyReport() {
    const selectedMonth = document.getElementById('monthFilter').value;
    if (!selectedMonth) { alert("Please select a month!"); return; }

    let monthlyData = [];
    let grandTotal = 0;
    
    for (let i = 0; i < localStorage.length; i++) {
        let key = localStorage.key(i);
        if (key.startsWith(selectedMonth) && key.length === 10) {
            let dayData = JSON.parse(localStorage.getItem(key)) || [];
            let dayTotal = dayData.reduce((sum, item) => sum + item.total, 0);
            if (dayData.length > 0) {
                monthlyData.push({ date: key, total: dayTotal });
                grandTotal += dayTotal;
            }
        }
    }

    monthlyData.sort((a, b) => new Date(a.date) - new Date(b.date));
    if (monthlyData.length === 0) { alert("No data found for the selected month."); return; }

    let printWindow = window.open('', '_blank', 'width=800,height=600');
    let rows = monthlyData.map(d => `<tr><td>${d.date}</td><td style="text-align:right;">Rs ${d.total.toFixed(2)}</td></tr>`).join('');

    printWindow.document.write(`
        <html><head><title>Monthly Report</title><style>body{font-family:Arial;text-align:center;padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:8px;}</style></head>
        <body><h1>${COMPANY_NAME}</h1><h2>Monthly Sales Report: ${selectedMonth}</h2><table><thead><tr><th>Date</th><th>Total Sales</th></tr></thead><tbody>${rows}</tbody></table><h3>Grand Total: Rs ${grandTotal.toFixed(2)}</h3>
        <script>window.onload=function(){window.print();window.close();}<\/script></body></html>
    `);
    printWindow.document.close();
}

function deleteItem(index){ if(confirm("Delete?")){ let k=formatDate(currentDate); let d=JSON.parse(localStorage.getItem(k)); d.splice(index,1); saveData(d); loadData(); } }
function prepareAndPrintFull() { window.print(); }
function resetBillCounter() { if(confirm("Reset?")){ localStorage.setItem("lastBillNumber", 0); alert("Reset!"); } }
function closeDay(){ localStorage.setItem(formatDate(currentDate)+"_status", "closed"); loadData(); }
function openDay(){ localStorage.setItem(formatDate(currentDate)+"_status", "open"); loadData(); }
function prevDay(){ currentDate.setDate(currentDate.getDate() - 1); loadData(); }
function nextDay(){ currentDate.setDate(currentDate.getDate() + 1); loadData(); }
loadData();
</script>
</body>
</html>
